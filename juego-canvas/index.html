<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Gráfica - Cátedra</title>
    <style>
        body { 
            background: #111; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        canvas { 
            border: 2px solid #555; 
            box-shadow: 0 0 15px rgba(0,0,0,0.8); 
        }
        .instrucciones {
            margin-top: 15px;
            background: #222;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>Visualizador de Personaje (TypeScript + Canvas)</h1>
    
    <!-- Aquí se inyecta el canvas automáticamente o puedes dejarlo fijo -->
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="instrucciones">
        <p>Abre la consola del navegador (F12) para ver los mensajes de la cátedra.</p>
    </div>

    <!-- Cargamos el archivo JavaScript compilado -->
    <script src="game.js"></script>
</body>
</html>
