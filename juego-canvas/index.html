<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego 1P - Responsive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #0b090a; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            margin: 0; 
            padding: 10px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.1rem; margin: 5px 0; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); text-align: center; }
        
        canvas { 
            max-width: 100%;
            height: auto;
            border: 2px solid #00ffcc; 
            box-shadow: 0 0 15px rgba(0,255,204,0.3); 
            background: #0b090a;
            touch-action: none;
        }
        .panel-control {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            background: #161a1d;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            width: 100%;
            max-width: 580px;
            box-sizing: border-box;
        }
        .grupo-botones {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button { 
            background: #212529; 
            color: #00ffcc; 
            border: 1px solid #00ffcc; 
            padding: 8px 12px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold;
            font-size: 0.75rem;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        button:hover { 
            background: #00ffcc; 
            color: #0b090a; 
            box-shadow: 0 0 10px #00ffcc;
        }
        .btn-accion { color: #ff00ff; border-color: #ff00ff; }
        .btn-accion:hover { background: #ff00ff; color: #0b090a; }
        .btn-log-toggle { background: #333; color: #fff; border: 1px solid #fff; margin-top: 4px; }

        /* Consola de Logs Flotante Adaptable */
        #logPanel {
            position: fixed; right: 10px; top: 10px; width: 280px; height: 300px;
            background: rgba(22, 26, 29, 0.95); border: 1px solid #00ffcc; border-radius: 8px;
            display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,255,204,0.2);
            font-family: monospace; font-size: 10px; z-index: 100;
        }
        .log-header { background: #00ffcc; color: #0b090a; padding: 5px 10px; font-weight: bold; display: flex; justify-content: space-between; }
        #logContent { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
        .log-item { border-bottom: 1px dashed #333; padding-bottom: 3px; color: #00ffcc; }

        /* Estilo responsivo para celulares */
        @media (max-width: 768px) {
            body { padding: 5px; justify-content: center; }
            h1 { font-size: 0.95rem; }
            canvas { width: 100%; max-height: 45vh; }
            .panel-control { padding: 6px; gap: 4px; }
            button { padding: 6px 10px; font-size: 0.7rem; }
            #logPanel { width: 90%; right: 5%; height: 250px; }
        }
    </style>
</head>
<body>

    <h1>Visualizador de Personaje (1P)</h1>
    
    <canvas id="gameCanvas" width="600" height="320"></canvas>

    <div class="panel-control">
        <div style="font-size: 0.8rem;"><strong>Movimiento:</strong></div>
        <div class="grupo-botones">
            <button id="btnArriba">⬆️ Arriba</button>
            <button id="btnAbajo">⬇️ Abajo</button>
            <button id="btnIzquierda">⬅️ Izq</button>
            <button id="btnDerecha">➡️ Der</button>
        </div>

        <div style="font-size: 0.8rem;"><strong>Acciones:</strong></div>
        <div class="grupo-botones">
            <button onclick="cambiarArmaEspada()">⚔️ Espada</button>
            <button onclick="cambiarArmaArco()">🏹 Arco</button>
            <button onclick="cambiarHabCuracion()">✨ Sanar</button>
            <button onclick="cambiarHabEscudo()">🛡️ Escudo</button>
            <button class="btn-accion" onclick="dispararLuz()">💥 Disparar</button>
        </div>

        <button class="btn-log-toggle" onclick="toggleLog()">📜 Consola [LOG]</button>
    </div>

    <div id="logPanel" style="display: none;">
        <div class="log-header">
            <span>Consola de Registros [LOG]</span>
            <span style="cursor:pointer;" onclick="toggleLog()">[X]</span>
        </div>
        <div id="logContent"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
