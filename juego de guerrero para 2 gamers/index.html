<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego 2P - Cátedra Ingeniería de Software 2</title>
    <style>
        body { 
            background: #0b090a; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow-x: hidden;
        }
        .contenedor-principal {
            display: flex;
            align-items: center;
            gap: 15px;
            /* Margen derecho para dar espacio a la consola de logs sin superponerse */
            margin-right: 290px; 
        }
        .panel-lateral {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #161a1d;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            width: 145px;
            text-align: center;
        }
        h3 { font-size: 0.85rem; margin: 0 0 4px 0; color: #00ffcc; }
        canvas { 
            border: 2px solid #00ffcc; 
            box-shadow: 0 0 20px rgba(0,255,204,0.3); 
            background: #080708;
        }
        button { 
            background: #212529; 
            color: #fff; 
            border: 1px solid #555; 
            padding: 7px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-size: 0.72rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { background: #00ffcc; color: #0b090a; border-color: #00ffcc; }
        button:disabled { background: #111; color: #555; border-color: #333; cursor: not-allowed; }
        .btn-p1 { border-color: #00ffff; color: #00ffff; }
        .btn-p2 { border-color: #ff33cc; color: #ff33cc; }
        .btn-especial { background: #330022; border-color: #ff0055; color: #ff0055; }
        .btn-especial:hover:not(:disabled) { background: #ff0055; color: #fff; }

        /* Consola de Logs Flotante acomodada a la derecha sin estorbar */
        #logPanel {
            position: fixed; 
            right: 15px; 
            top: 15px; 
            width: 270px; 
            height: calc(100vh - 30px);
            max-height: 450px;
            background: rgba(22, 26, 29, 0.96); 
            border: 1px solid #00ffcc; 
            border-radius: 8px;
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
            font-family: monospace; 
            font-size: 10px; 
            z-index: 100;
        }
        .log-header { background: #00ffcc; color: #0b090a; padding: 6px 10px; font-weight: bold; display: flex; justify-content: space-between; }
        #logContent { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
        .log-item { border-bottom: 1px dashed #333; padding-bottom: 3px; color: #00ffcc; }
        .btn-log { position: fixed; bottom: 15px; right: 15px; background: #00ffcc; color: #0b090a; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; z-index: 101; font-size: 11px; }
    </style>
</head>
<body>

    <button class="btn-log" onclick="toggleLog()">📜 Ver/Ocultar [LOG]</button>

    <div class="contenedor-principal">
        <!-- Panel Izquierda: Jugador 1 -->
        <div class="panel-lateral">
            <h3 style="color: #00ffff;">Jugador 1</h3>
            <button class="btn-p1" id="p1Arriba">⬆️ Arriba</button>
            <div style="display: flex; gap: 5px;">
                <button class="btn-p1" id="p1Izq" style="flex:1;">⬅️</button>
                <button class="btn-p1" id="p1Der" style="flex:1;">➡️</button>
            </div>
            <button class="btn-p1" id="p1Abajo">⬇️ Abajo</button>
            <hr style="border-color: #333; width:100%;">
            <button class="btn-p1" id="btnP1Atacar" onclick="accionP1('atacar')">⚔️ Atacar</button>
            <button class="btn-especial" id="btnP1Especial" onclick="accionP1('especial')" disabled>✨ Especial (F)</button>
            <button class="btn-p1" id="btnP1Curar" onclick="accionP1('curar')">🧪 Curación</button>
            <button class="btn-p1" id="btnP1Escudo" onclick="accionP1('escudo')">🛡️ Escudo</button>
        </div>

        <!-- Canvas Central -->
        <canvas id="gameCanvas" width="560" height="380"></canvas>

        <!-- Panel Derecha: Jugador 2 -->
        <div class="panel-lateral">
            <h3 style="color: #ff33cc;">Jugador 2</h3>
            <button class="btn-p2" id="p2Arriba">⬆️ Arriba</button>
            <div style="display: flex; gap: 5px;">
                <button class="btn-p2" id="p2Izq" style="flex:1;">⬅️</button>
                <button class="btn-p2" id="p2Der" style="flex:1;">➡️</button>
            </div>
            <button class="btn-p2" id="p2Abajo">⬇️ Abajo</button>
            <hr style="border-color: #333; width:100%;">
            <button class="btn-p2" id="btnP2Atacar" onclick="accionP2('atacar')">⚔️ Atacar</button>
            <button class="btn-especial" id="btnP2Especial" onclick="accionP2('especial')" disabled>✨ Especial (L)</button>
            <button class="btn-p2" id="btnP2Curar" onclick="accionP2('curar')">🧪 Curación</button>
            <button class="btn-p2" id="btnP2Escudo" onclick="accionP2('escudo')">🛡️ Escudo</button>
        </div>
    </div>

    <!-- Panel de Logs -->
    <div id="logPanel" style="display: none;">
        <div class="log-header">
            <span>Registro de Eventos [LOG]</span>
            <span style="cursor:pointer;" onclick="toggleLog()">[X]</span>
        </div>
        <div id="logContent"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
